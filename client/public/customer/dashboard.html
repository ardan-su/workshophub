<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dashboard · WorkshopHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="page-head">
        <div>
          <h1 id="greeting">Welcome back</h1>
          <p>Here's what's happening with your vehicles.</p>
        </div>
        <a href="/customer/booking.html" class="btn btn-accent">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          Book a service
        </a>
      </div>

      <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr);" id="statGrid"></div>

      <div style="display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; margin-top:24px;">
        <div class="card">
          <div class="card-header"><h3>Current service status</h3><a href="/customer/tracking.html" class="text-sm" style="color:var(--color-primary-dark);">Track live →</a></div>
          <div class="card-body" id="currentServices"></div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Upcoming booking</h3></div>
          <div class="card-body" id="upcomingBooking"></div>
        </div>
      </div>

      <div class="card" style="margin-top:24px;">
        <div class="card-header"><h3>Recent transactions</h3><a href="/customer/transactions.html" class="text-sm" style="color:var(--color-primary-dark);">View all →</a></div>
        <div class="table-wrap" style="border:none;">
          <table class="data-table">
            <thead><tr><th>Invoice</th><th>Service</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
            <tbody id="txBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/socket.js"></script>
<script src="/js/shared/ui.js"></script>
<script src="/js/shared/toast.js"></script>
<script src="/js/shared/modal.js"></script>
<script src="/js/shared/layout.js"></script>
<script>
  const user = Session.requireRole('customer');
  if (user) Layout.render({ role: 'customer', active: 'dashboard' });
</script>
<script src="/js/customer/dashboard.js"></script>
</body>
</html>
