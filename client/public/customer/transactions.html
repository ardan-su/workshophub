<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Transactions · WorkshopHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="page-head">
        <div>
          <h1>Transactions</h1>
          <p>Your invoices and payment history.</p>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap" style="border:none;">
          <table class="data-table">
            <thead><tr><th>Invoice</th><th>Service</th><th>Amount</th><th>Payment Method</th><th>Status</th><th>Date</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/socket.js"></script>
<script src="/js/shared/ui.js"></script>
<script src="/js/shared/toast.js"></script>
<script src="/js/shared/modal.js"></script>
<script src="/js/shared/layout.js"></script>
<script>
  const user = Session.requireRole('customer');
  if (user) Layout.render({ role: 'customer', active: 'transactions' });
</script>
<script src="/js/customer/transactions.js"></script>
</body>
</html>
