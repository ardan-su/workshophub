<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>My Vehicles · WorkshopHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="page-head">
        <div>
          <h1>My Vehicles</h1>
          <p>Register and manage the vehicles on your account.</p>
        </div>
        <button class="btn btn-accent" id="addVehicleBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          Register vehicle
        </button>
      </div>

      <div id="vehicleGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px;"></div>

    </main>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/socket.js"></script>
<script src="/js/shared/ui.js"></script>
<script src="/js/shared/toast.js"></script>
<script src="/js/shared/modal.js"></script>
<script src="/js/shared/layout.js"></script>
<script>
  const user = Session.requireRole('customer');
  if (user) Layout.render({ role: 'customer', active: 'vehicles' });
</script>
<script src="/js/customer/vehicles.js"></script>
</body>
</html>
