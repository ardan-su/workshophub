<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Track Service · WorkshopHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="page-head">
        <div>
          <h1>Track Service</h1>
          <p>Live status of your vehicles — updates instantly, no refresh needed.</p>
        </div>
        <span class="chip" id="liveChip"><span style="width:6px;height:6px;border-radius:50%;background:var(--color-success);display:inline-block;"></span> Live</span>
      </div>

      <div id="servicesWrap" class="flex flex-col gap-4"></div>

    </main>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/socket.js"></script>
<script src="/js/shared/ui.js"></script>
<script src="/js/shared/toast.js"></script>
<script src="/js/shared/modal.js"></script>
<script src="/js/shared/layout.js"></script>
<script>
  const user = Session.requireRole('customer');
  if (user) Layout.render({ role: 'customer', active: 'tracking' });
</script>
<script src="/js/customer/tracking.js"></script>
</body>
</html>
