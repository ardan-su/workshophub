<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WorkshopHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
<script>
  (function () {
    var token = localStorage.getItem('wh_token');
    var userRaw = localStorage.getItem('wh_user');
    if (!token || !userRaw) {
      location.replace('/login.html');
      return;
    }
    try {
      var user = JSON.parse(userRaw);
      location.replace(user.role === 'admin' ? '/admin/dashboard.html' : '/customer/dashboard.html');
    } catch (e) {
      location.replace('/login.html');
    }
  })();
</script>
</body>
</html>
