<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dashboard · WorkshopHub Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="page-head">
        <div>
          <h1>Dashboard</h1>
          <p>Live overview of your workshop, updated in real time.</p>
        </div>
      </div>

      <div class="stat-grid" id="statGrid"></div>

      <div style="display:grid; grid-template-columns: 1.6fr 1fr; gap:16px; margin-top:24px;">
        <div class="card">
          <div class="card-header">
            <h3>Revenue — last 14 days</h3>
            <span class="badge badge-primary" id="revenueTodayBadge">Today: —</span>
          </div>
          <div class="card-body" id="revenueChart"></div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Service pipeline</h3></div>
          <div class="card-body" id="pipelineBreakdown"></div>
        </div>
      </div>

      <div class="card" style="margin-top:24px;">
        <div class="card-header">
          <h3>Quick actions</h3>
        </div>
        <div class="card-body flex gap-3" style="flex-wrap:wrap;">
          <a href="/admin/bookings.html" class="btn btn-outline">Review pending bookings</a>
          <a href="/admin/services.html" class="btn btn-outline">Manage service queue</a>
          <a href="/admin/spareparts.html" class="btn btn-outline">Check low stock</a>
          <a href="/admin/reports.html" class="btn btn-outline">View reports</a>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/socket.js"></script>
<script src="/js/shared/ui.js"></script>
<script src="/js/shared/toast.js"></script>
<script src="/js/shared/modal.js"></script>
<script src="/js/shared/layout.js"></script>
<script>
  const user = Session.requireRole('admin');
  if (user) Layout.render({ role: 'admin', active: 'dashboard' });
</script>
<script src="/js/admin/dashboard.js"></script>
</body>
</html>
