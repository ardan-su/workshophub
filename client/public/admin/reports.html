<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reports · WorkshopHub Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="page-head">
        <div>
          <h1>Reports</h1>
          <p>Service, booking, revenue and inventory insights.</p>
        </div>
      </div>

      <div class="tabs" id="reportTabs">
        <button class="tab-btn active" data-tab="revenue">Revenue</button>
        <button class="tab-btn" data-tab="services">Services</button>
        <button class="tab-btn" data-tab="bookings">Bookings</button>
        <button class="tab-btn" data-tab="inventory">Inventory</button>
      </div>

      <div class="toolbar" style="margin-top:16px;">
        <div class="field" style="margin:0;"><label class="text-xs">From</label><input class="input" type="date" id="fromDate" /></div>
        <div class="field" style="margin:0;"><label class="text-xs">To</label><input class="input" type="date" id="toDate" /></div>
        <button class="btn btn-outline" id="applyRange" style="align-self:flex-end;">Apply</button>
        <button class="btn btn-ghost" id="clearRange" style="align-self:flex-end;">Clear</button>
      </div>

      <div id="reportContent"></div>

    </main>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/socket.js"></script>
<script src="/js/shared/ui.js"></script>
<script src="/js/shared/toast.js"></script>
<script src="/js/shared/modal.js"></script>
<script src="/js/shared/layout.js"></script>
<script>
  const user = Session.requireRole('admin');
  if (user) Layout.render({ role: 'admin', active: 'reports' });
</script>
<script src="/js/admin/reports.js"></script>
</body>
</html>
