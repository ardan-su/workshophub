<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mechanics · WorkshopHub Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="page-head">
        <div>
          <h1>Mechanics</h1>
          <p>Manage your workshop's technicians and their active workload.</p>
        </div>
        <button class="btn btn-accent" id="addMechanicBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          Add mechanic
        </button>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Search by name or specialization…" />
        </div>
      </div>

      <div class="card">
        <div class="table-wrap" style="border:none;">
          <table class="data-table">
            <thead>
              <tr><th>Mechanic</th><th>Specialization</th><th>Contact</th><th>Active jobs</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="paginationBar"></div>
      </div>

    </main>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/shared/api.js"></script>
<script src="/js/shared/auth.js"></script>
<script src="/js/shared/socket.js"></script>
<script src="/js/shared/ui.js"></script>
<script src="/js/shared/toast.js"></script>
<script src="/js/shared/modal.js"></script>
<script src="/js/shared/layout.js"></script>
<script>
  const user = Session.requireRole('admin');
  if (user) Layout.render({ role: 'admin', active: 'mechanics' });
</script>
<script src="/js/admin/mechanics.js"></script>
</body>
</html>
